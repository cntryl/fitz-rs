name: ci

on:
  workflow_dispatch:
    inputs:
      broker_tag:
        description: Fitz broker image tag
        type: choice
        options: [main, develop]
        default: main
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

env:
  FITZ_BROKER_IMAGE: ghcr.io/cntryl/fitz:${{ inputs.broker_tag || 'main' }}

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [1.88.0, stable]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run strict Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic

      - name: Build all targets
        run: cargo build --locked --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps

      - name: Package crate
        run: cargo package

  broker:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Start broker stack
        run: docker compose up -d

      - name: Run broker-backed conformance and domain matrix
        shell: bash
        run: |
          for transport in tcp ws; do
            for auth_mode in anonymous valid_jwt; do
              output="artifacts/conformance-${transport}-${auth_mode}.json"
              CONFORMANCE_TRANSPORT="$transport" \
                CONFORMANCE_AUTH_MODE="$auth_mode" \
                CONFORMANCE_OUTPUT="$output" \
                cargo test --test conformance -- --ignored --nocapture
            done
          done

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fitz-rs-conformance-results
          path: artifacts/conformance-*.json
          if-no-files-found: warn

      - name: Stop broker stack
        if: always()
        run: docker compose down --volumes

  security:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Cargo security tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit dependencies
        run: cargo audit

      - name: Check dependency policy
        run: cargo deny check

name: Spec

on:
  workflow_dispatch:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FITZ_BROKER_IMAGE: ghcr.io/cntryl/fitz:latest

jobs:
  spec:
    name: Broker-backed shared spec
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Start broker stack
        run: docker compose up -d --pull always

      - name: Run broker-backed conformance and domain matrix
        shell: bash
        run: |
          for transport in tcp ws; do
            for auth_mode in anonymous valid_jwt; do
              mkdir -p artifacts
              output="artifacts/conformance-${transport}-${auth_mode}.json"
              CONFORMANCE_TRANSPORT="$transport" \
                CONFORMANCE_AUTH_MODE="$auth_mode" \
                CONFORMANCE_OUTPUT="$output" \
                cargo test --test conformance -- --ignored --nocapture
            done
          done

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fitz-rs-conformance-results
          path: artifacts/conformance-*.json
          if-no-files-found: warn

      - name: Run cancellation chains against latest broker
        shell: bash
        run: |
          for transport in tcp ws; do
            for auth_mode in anonymous valid_jwt; do
              case "$transport/$auth_mode" in
                tcp/anonymous) endpoint=tcp://127.0.0.1:4191 ;;
                ws/anonymous) endpoint=ws://127.0.0.1:4190/ws ;;
                tcp/valid_jwt) endpoint=tcp://127.0.0.1:4091 ;;
                ws/valid_jwt) endpoint=ws://127.0.0.1:4090/ws ;;
              esac
              if [[ "$auth_mode" == valid_jwt ]]; then
                FITZ_RPC_CHAIN_ADDR="$endpoint" FITZ_BROKER_JWT_HMAC_SECRET=dev-test-secret \
                  cargo test --locked --test rpc_chain -- --ignored --nocapture
              else
                env -u FITZ_BROKER_JWT_HMAC_SECRET FITZ_RPC_CHAIN_ADDR="$endpoint" \
                  cargo test --locked --test rpc_chain -- --ignored --nocapture
              fi
            done
          done

      - name: Stop broker stack
        if: always()
        run: docker compose down --volumes

[package]
name = "cntryl-fitz"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Async Rust SDK for the Fitz event streaming and orchestration platform"
license = "Apache-2.0"
repository = "https://github.com/cntryl/fitz-rs"
homepage = "https://github.com/cntryl/fitz"
documentation = "https://docs.rs/cntryl-fitz"
readme = "README.md"
keywords = ["fitz", "queue", "stream", "rpc", "database"]
categories = ["api-bindings", "asynchronous", "database"]
exclude = ["artifacts/", "compose.yml"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync"] }
bytes = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "0.28"
futures-util = "0.3"
futures-core = "0.3"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
parking_lot = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
jsonwebtoken = "9"
serde_yaml = "0.9"
criterion = { version = "0.7", features = ["async_tokio"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[[bench]]
name = "codec"
harness = false
